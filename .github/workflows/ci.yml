name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: make setup PYTHON=python

      - name: Tests
        run: make test PYTHON=python

      - name: Rebuild dataset from committed API cache (offline) and compare
        run: make verify-data PYTHON=python

      - name: Regenerate README Results numbers and compare
        run: make check-results PYTHON=python
